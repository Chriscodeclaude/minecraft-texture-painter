<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PvP Texture Painter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: item list | 3D view | pixels + colours. On phones: one column. Dark navy look from krisz's palette. */
  :root {
    --navy: #1E3058; --steel: #496896; --grey: #A4B5D3; --light: #B0CBE6; --pink: #FED6CE;
    --bg: #121c33; --panel: #1E3058; --text: #eef3fb; --muted: #A4B5D3; --line: #2d4473; --cellA: #16223f; --cellB: #1b2a4c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  .app { display: grid; grid-template-columns: 240px 1fr 330px; height: 100%; }
  aside, .right { background: var(--panel); overflow-y: auto; padding-block: 12px; padding-inline: 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 0 6px; }
  h2:first-child { margin-top: 0; }
  .item { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 6px; border: 0; border-radius: 6px;
          background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
  .item:hover { background: var(--line); }
  .item.on { background: var(--steel); }
  .item .num { color: var(--muted); width: 22px; font-size: 12px; font-variant-numeric: tabular-nums; }
  .item .mark { margin-left: auto; }
  .item canvas { width: 20px; height: 20px; image-rendering: pixelated; }
  .center { position: relative; min-height: 0; }
  #view { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  .title { position: absolute; top: 14px; left: 16px; font-size: 20px; font-weight: 600; pointer-events: none; }
  .hint { position: absolute; bottom: 14px; left: 16px; right: 16px; color: var(--muted); pointer-events: none; }
  #pickItem { display: none; }
  #grid { width: 100%; max-width: 100%; aspect-ratio: 1; image-rendering: pixelated; background: #0c1426; border-radius: 6px; cursor: crosshair; display: block; touch-action: none; }
  .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
  .sw { aspect-ratio: 1; border-radius: 5px; border: 2px solid rgba(255,255,255,.25); cursor: pointer; padding: 0; }
  .sw.on { border-color: #fff; outline: 2px solid var(--navy); }
  .theme { grid-template-columns: repeat(5, 1fr); }
  .now { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .now .big { width: 40px; height: 40px; border-radius: 8px; border: 2px solid #fff; }
  input[type=color] { width: 100%; height: 36px; border: 0; background: none; cursor: pointer; padding: 0; }
  .btn { display: block; width: 100%; margin-top: 8px; padding: 10px; border: 0; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer;
         background: var(--pink); color: var(--navy); }
  .btn.alt { background: var(--steel); color: var(--text); }
  .btn:focus-visible, .item:focus-visible, .sw:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
  .status { margin-top: 8px; color: var(--muted); font-size: 13px; min-height: 18px; }

  /* phones and narrow windows */
  @media (max-width: 820px) {
    body { overflow: auto; }
    .app { display: block; height: auto; }
    aside { display: none; }
    #pickItem { display: block; width: 100%; padding: 10px; border-radius: 8px; border: 0; font: inherit; font-size: 16px;
                background: var(--steel); color: var(--text); }
    .top { padding-block: 10px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); }
    .center { height: 52vh; }
    .title { display: none; }
    .hint { font-size: 12px; bottom: 8px; }
    .right { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; }
  }
  @media (min-width: 821px) { .top { display: none; } }
</style>
</head><body>

<div class="top"><select id="pickItem" aria-label="Item"></select></div>
<div class="app">
  <aside id="list"></aside>
  <div class="center">
    <canvas id="view"></canvas>
    <div class="title" id="title"></div>
    <div class="hint">Drag to spin · scroll or pinch to zoom · tap a pixel to paint</div>
  </div>
  <div class="right">
    <h2>Pixels</h2>
    <canvas id="grid"></canvas>
    <button class="btn alt" id="undo">↶ Undo</button>
    <h2>Theme colours</h2>
    <div class="swatches theme" id="theme"></div>
    <h2>More colours</h2>
    <div class="swatches" id="more"></div>
    <h2>Any colour</h2>
    <input type="color" id="picker" value="#496896">
    <div class="now"><div class="big" id="nowSw"></div><div id="nowHex"></div></div>
    <h2>Save</h2>
    <button class="btn" id="png">Download this item (.png)</button>
    <button class="btn" id="zip">Download pack (.zip)</button>
    <button class="btn alt" id="connect" hidden>Connect pack folder</button>
    <button class="btn alt" id="save" hidden>Save to pack folder</button>
    <div class="status" id="status"></div>
  </div>
</div>

for (const it of ITEMS) {
  const start = await loadImg('data:image/png;base64,' + it.start);
  const sc = document.createElement('canvas'); sc.width = start.width; sc.height = start.height;
  const sx = sc.getContext('2d'); sx.drawImage(start, 0, 0);
  it.sw = start.width; it.sh = start.height; it.startPx = sx.getImageData(0, 0, it.sw, it.sh).data;
  const img = (get('tp:' + it.id) && await loadImg(get('tp:' + it.id))) || start;
  it.cv = document.createElement('canvas'); it.cv.width = img.width; it.cv.height = img.height;
  it.cx = it.cv.getContext('2d', { willReadFrequently: true }); it.cx.drawImage(img, 0, 0);
  it.done = changed(it);
  it.hist = [];   // undo: list of strokes, each stroke = old pixels [x, y, r, g, b, a]
}

// ---- item list (sidebar on computers, dropdown on phones) ----
function drawList() {
  const box = $('list'); box.innerHTML = ''; let g = '';
  const sel = $('pickItem'); sel.innerHTML = ''; let og = null;
  ITEMS.forEach((it, i) => {
    if (it.group !== g) { g = it.group; const h = document.createElement('h2'); h.textContent = g; box.append(h);
      og = document.createElement('optgroup'); og.label = g; sel.append(og); }
    const b = document.createElement('button'); b.className = 'item' + (i === cur ? ' on' : '');
    const th = document.createElement('canvas'); th.width = it.cv.width; th.height = it.cv.height; th.getContext('2d').drawImage(it.cv, 0, 0);
    b.innerHTML = `<span class="num">${it.n}</span>`; b.append(th);
    b.insertAdjacentHTML('beforeend', `<span>${it.name}</span><span class="mark">${it.done ? '✅' : '❌'}</span>`);
    b.onclick = () => choose(i); box.append(b);
    const o = document.createElement('option'); o.value = i; o.textContent = `${it.done ? '✅' : '❌'} ${it.n}. ${it.name}`; o.selected = i === cur; og.append(o);
  });
}
function choose(i) { cur = i; drawList(); show(); }
$('pickItem').onchange = e => choose(+e.target.value);

// ---- colours ----
function setColor(c) { color = c; $('picker').value = c; $('nowSw').style.background = c; $('nowHex').textContent = c.toUpperCase();
  document.querySelectorAll('.sw').forEach(s => s.classList.toggle('on', s.dataset.c.toLowerCase() === c.toLowerCase())); }
function swatches(el, list) { for (const c of list) { const s = document.createElement('button'); s.className = 'sw'; s.dataset.c = c; s.style.background = c; s.title = c; s.setAttribute('aria-label', c); s.onclick = () => setColor(c); el.append(s); } }
swatches($('theme'), THEME); swatches($('more'), MORE);
$('picker').oninput = e => setColor(e.target.value);

// ---- painting (only inside the item's shape) ----
function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

  const [r, g, b] = hexRGB(color);
  if (d.data[0] === r && d.data[1] === g && d.data[2] === b && d.data[3] === 255) return;

  if (!s) { say('Nothing to undo.'); return; }
  for (const [x, y, r, g, b, a] of s.reverse()) it.cx.putImageData(new ImageData(new Uint8ClampedArray([r, g, b, a]), 1, 1), x, y);

$('undo').onclick = undo;
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); } });

const saveTimers = new Map();
function saveNow(it, redraw = true) {

  it.done = changed(it);
  if (it.done) put('tp:' + it.id, it.cv.toDataURL());

}
function remember(it) { clearTimeout(saveTimers.get(it.id)); saveTimers.set(it.id, setTimeout(() => saveNow(it), 300)); }

// ---- 2D pixel grid ----
const grid = $('grid'), gx = grid.getContext('2d');
function drawGrid() {
  const it = ITEMS[cur], w = it.cv.width, h = it.cv.height, S = 640; grid.width = S; grid.height = S;

}
let gridDown = false;

// ---- 3D view ----
const view = $('view');
const renderer = new THREE.WebGLRenderer({ canvas: view, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color('#121c33');
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 500); camera.position.set(0, 0, 40);
scene.add(new THREE.AmbientLight(0xffffff, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(10, 20, 30); scene.add(sun);
const back = new THREE.DirectionalLight(0xB0CBE6, 0.8); back.position.set(-10, -5, -30); scene.add(back);
const holder = new THREE.Group(); scene.add(holder); holder.rotation.set(-0.25, 0.6, 0);
let mesh = null, cells = null, tex = null;

function show() {
  const it = ITEMS[cur]; $('title').textContent = `${it.n}. ${it.name}`;
  if (mesh) { holder.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose(); }
  if (tex) { tex.dispose(); tex = null; }

      const o = (y * w + x) * 4; c.setRGB(px[o] / 255, px[o + 1] / 255, px[o + 2] / 255, THREE.SRGBColorSpace); mesh.setColorAt(i, c);

  const hit = ray.intersectObject(mesh)[0]; if (!hit) return; const it = ITEMS[cur]; startStroke();
  if (tex) paint(Math.floor(hit.uv.x * it.cv.width), Math.floor((1 - hit.uv.y) * it.cv.height));
  else { const [x, y] = cells.list[hit.instanceId]; paint(x, y); }
}
function resize() { const r = view.parentElement.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);
renderer.setAnimationLoop(() => renderer.render(scene, camera));

// ---- saving ----
const say = t => $('status').textContent = t;
const pngOf = it => new Promise(r => it.cv.toBlob(r, 'image/png'));
async function offerFile(filename, blob) {
  const api = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
  if (api) { try { await api.save({ filename, data: blob }); return 'Saved ' + filename; }
             catch (err) { return err && err.code === 'declined' ? 'Not saved.' : 'Saving is not possible here.'; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click(); return 'Saved ' + filename;
}
$('png').onclick = async () => {
  const it = ITEMS[cur];
  say(await offerFile(it.out.split('/').pop(), await pngOf(it)));
};
$('zip').onclick = async () => {
  for (const it of ITEMS) if (saveTimers.has(it.id)) saveNow(it, false);
  drawList();
  const painted = ITEMS.filter(it => it.done);
  if (!painted.length) { say('Paint something first.'); return; }
  say('Making the pack…');
  const zip = new JSZip(); zip.file('pack.mcmeta', PACK_MCMETA);
  for (const it of painted) zip.file('assets/minecraft/' + it.out, await pngOf(it));
  const blob = await zip.generateAsync({ type: 'blob' });
  say(await offerFile('pvp-pack.zip', blob) + ` (${painted.length} items). Put it in .minecraft/resourcepacks.`);
};

// folder saving: only in Chrome/Edge on a computer, opened as a file (not inside a frame)
let inFrame = true; try { inFrame = window.top !== window; } catch {}
if (window.showDirectoryPicker && !inFrame) { $('connect').hidden = false; $('save').hidden = false; }
async function fileIn(root, path, create) {
  const parts = ('assets/minecraft/' + path).split('/'); let d = root;
  for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p, { create });
  return d.getFileHandle(parts.at(-1), { create });
}
$('connect').onclick = async () => {
  try { dir = await window.showDirectoryPicker({ mode: 'readwrite' }); } catch { return; }
  try { await dir.getFileHandle('pack.mcmeta'); } catch { dir = null; say('That is not the pack. Pick the "resourcepack" folder.'); return; }
  let found = 0;
  for (const it of ITEMS) {
    try { const f = await (await fileIn(dir, it.out, false)).getFile(); const img = await loadImg(URL.createObjectURL(f));
      if (!img) continue; it.cv.width = img.width; it.cv.height = img.height; it.cx.drawImage(img, 0, 0); it.hist = []; saveNow(it, false); found++; } catch {}
  }
  say(`Connected. Found ${found} saved textures.`); drawList(); show();
};
$('save').onclick = async () => {
  const it = ITEMS[cur];
  if (!dir) { say('Connect the pack folder first.'); return; }
  try { const w = await (await fileIn(dir, it.out, true)).createWritable(); await w.write(await pngOf(it)); await w.close();
    saveNow(it); say(`Saved ${it.name} ✅`);
  } catch (err) { say('Could not save: ' + err.message); }
};

setColor(color); drawList(); resize(); show();
</script>

</body></html>
